<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — HomeSoft 98</title>
  <link rel="stylesheet" href="./vendor/98.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #008080; font-family: Tahoma, sans-serif; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .window { width: min(360px, 100%); }
    .window-body p { margin: 0 0 12px; }
    .actions { display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="window">
      <div class="title-bar">
        <div class="title-bar-text">A:\\ — File not found</div>
      </div>
      <div class="window-body">
        <p><b>404</b></p>
        <p>HomeSoft cannot find the file specified. It may have been moved, renamed, or taken off Maple.</p>
        <div class="actions"><a href="./"><button type="button" class="default">OK</button></a></div>
      </div>
    </div>
  </div>
</body>
</html>
